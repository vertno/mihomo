name: Stable release
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.select.outputs.tag }}
      source: ${{ steps.select.outputs.source }}
      core: ${{ steps.select.outputs.core }}
      waiting: ${{ steps.select.outputs.waiting }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 control/release/sync.py
  test:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jobs: [{test: test}]
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: ./.github/distribution-actions/setup
      - uses: ./.github/distribution-actions/test

  build:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jobs:
          - {goos: windows, goarch: amd64, goamd64: v2, output: amd64-v2}
          - {goos: windows, goarch: arm64, output: arm64}
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      BUILDTAG: -extldflags --static
      VERSION: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: ./.github/distribution-actions/setup
      - name: Set the timestamp of the pinned source
        run: echo "BUILDTIME=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
      - uses: ./.github/distribution-actions/build
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.jobs.output }}
          path: mihomo-windows-*-${{ env.VERSION }}.zip
          if-no-files-found: error

  publish:
    needs: [plan, test, build]
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Verify and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          SOURCE_SHA: ${{ needs.plan.outputs.source }}
        run: |
          printf '%s\n' "$RELEASE_TAG" >assets/version.txt
          python3 control/release/publish.py
  wake:
    needs: [plan, publish]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report pending app installation
        if: vars.WAKE_APP_CLIENT_ID == ''
        run: echo '::warning::Cross-repository wake requires the release app. Scheduled reconciliation remains enabled.'
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        id: app
        if: vars.WAKE_APP_CLIENT_ID != ''
        with:
          client-id: ${{ vars.WAKE_APP_CLIENT_ID }}
          private-key: ${{ secrets.WAKE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: clash-verge-rev,ClashMetaForAndroid
          permission-actions: write
      - name: Wake dependent release checks
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          status=0
          for repo in clash-verge-rev ClashMetaForAndroid; do
            gh workflow run sync.yml -R "vertno/$repo" --ref distribution || status=1
          done
          exit "$status"
